[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subdangler"
version = "0.1.0"
description = "Dangling DNS / subdomain takeover risk checker (stdlib only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["dns", "subdomain-takeover", "security", "cname"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
subdangler = "subdangler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subdangler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
